<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#176b5d">
  <title>つなぐノート｜介護施設向け情報共有</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand: #176b5d;
      --brand-dark: #0e5147;
      --brand-soft: #e5f2ee;
      --brand-pale: #f1f8f5;
      --ink: #20302b;
      --muted: #5e6e68;
      --subtle: #7b8984;
      --canvas: #eeeae2;
      --surface: #fbfaf7;
      --card: #ffffff;
      --line: #d9e1dd;
      --line-strong: #bdcac5;
      --important: #b4362e;
      --important-soft: #fceae8;
      --incident: #a8490c;
      --incident-soft: #fff0e2;
      --family: #6a4c8d;
      --family-soft: #f2ecf7;
      --navy: #34495e;
      --shadow-sm: 0 1px 2px rgba(22, 50, 42, .06), 0 4px 12px rgba(22, 50, 42, .04);
      --shadow-md: 0 14px 36px rgba(22, 50, 42, .12);
      --radius: 18px;
      --radius-sm: 12px;
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--canvas); }
    body {
      min-height: 100%;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 0%, rgba(255,255,255,.82), transparent 30rem),
        var(--canvas);
      font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      font-size: 15px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    button, input, textarea, select { font: inherit; }
    button { touch-action: manipulation; }
    button, a, input, textarea, select { outline: none; }
    button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: 3px solid #f0a24b;
      outline-offset: 2px;
    }
    .hidden { display: none !important; }
    .icon {
      width: 22px;
      height: 22px;
      display: inline-block;
      flex: 0 0 auto;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .icon-sm { width: 17px; height: 17px; }
    .icon-lg { width: 29px; height: 29px; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    #app {
      position: relative;
      width: 100%;
      max-width: 480px;
      min-height: 100dvh;
      margin: 0 auto;
      overflow-x: hidden;
      background: var(--surface);
      box-shadow: 0 0 44px rgba(36, 51, 45, .14);
    }
    .app-shell { min-height: 100dvh; }

    /* Login */
    .login {
      display: flex;
      min-height: 100dvh;
      flex-direction: column;
      align-items: center;
      padding: max(28px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at 100% 0%, rgba(255,255,255,.7), transparent 18rem),
        linear-gradient(155deg, #dceee8 0%, #f8f4ec 52%, #f5eee2 100%);
    }
    .login-brand {
      display: flex;
      width: 100%;
      max-width: 438px;
      align-items: center;
      justify-content: center;
      gap: 11px;
      margin: 4px 0 24px;
      color: var(--brand-dark);
    }
    .brand-mark {
      display: grid;
      width: 43px;
      height: 43px;
      place-items: center;
      color: #fff;
      border-radius: 14px 14px 14px 5px;
      background: var(--brand);
      box-shadow: 0 8px 18px rgba(23,107,93,.2);
    }
    .login-brand strong { display: block; font-size: 20px; line-height: 1.2; letter-spacing: .04em; }
    .login-brand small { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; font-weight: 600; }
    .login-panel {
      width: 100%;
      max-width: 438px;
      padding: 22px 18px 18px;
      border: 1px solid rgba(189,202,197,.8);
      border-radius: 24px;
      background: rgba(255,255,255,.92);
      box-shadow: var(--shadow-md);
      backdrop-filter: blur(8px);
    }
    .stepper {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-bottom: 23px;
    }
    .step {
      position: relative;
      padding-top: 10px;
      color: var(--subtle);
      font-size: 11px;
      font-weight: 700;
      text-align: center;
    }
    .step::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 4px;
      border-radius: 99px;
      background: #dce4e0;
    }
    .step.done::before, .step.current::before { background: var(--brand); }
    .step.current { color: var(--brand-dark); }
    .login h1 { margin: 0; font-size: 22px; line-height: 1.45; letter-spacing: .01em; }
    .login-lead { margin: 7px 0 19px; color: var(--muted); font-size: 14px; }
    .field-label { display: block; margin-bottom: 7px; font-weight: 700; }
    .text-input {
      width: 100%;
      min-height: 52px;
      padding: 12px 14px;
      color: var(--ink);
      border: 1.5px solid var(--line-strong);
      border-radius: 12px;
      background: #fff;
      font-size: 16px;
    }
    .text-input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(23,107,93,.12); }
    .company-result {
      display: flex;
      align-items: center;
      gap: 11px;
      min-height: 65px;
      margin-top: 12px;
      padding: 11px 12px;
      border: 1px solid #bcd8cf;
      border-radius: 13px;
      background: var(--brand-pale);
    }
    .company-result .result-icon {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      color: var(--brand-dark);
      border-radius: 11px;
      background: var(--brand-soft);
    }
    .company-result strong { display: block; font-size: 14px; }
    .company-result span { color: var(--muted); font-size: 12px; }
    .input-note { min-height: 25px; margin: 8px 2px 0; color: var(--important); font-size: 12px; font-weight: 600; }
    .primary-btn, .secondary-btn {
      display: inline-flex;
      min-height: 50px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .primary-btn {
      width: 100%;
      margin-top: 13px;
      color: #fff;
      border: 0;
      background: var(--brand);
      box-shadow: 0 5px 14px rgba(23,107,93,.18);
    }
    .primary-btn:hover { background: var(--brand-dark); }
    .primary-btn:active { transform: translateY(1px); }
    .primary-btn:disabled { color: #91a09b; background: #dce4e1; box-shadow: none; cursor: not-allowed; }
    .secondary-btn {
      padding: 0 14px;
      color: var(--brand-dark);
      border: 1px solid var(--line-strong);
      background: #fff;
    }
    .back-btn {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      gap: 5px;
      margin: -6px 0 8px -7px;
      padding: 0 8px;
      color: var(--muted);
      border: 0;
      background: transparent;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .page-back-btn {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      gap: 5px;
      margin: -5px 0 7px -5px;
      padding: 0 9px;
      color: var(--brand-dark);
      border: 0;
      border-radius: 10px;
      background: transparent;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }
    .page-back-btn:hover,
    .page-back-btn:active { background: var(--brand-soft); }
    .user-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 10px;
    }
    .user-option {
      min-height: 122px;
      padding: 13px 8px 11px;
      color: var(--ink);
      border: 1.5px solid var(--line);
      border-radius: 15px;
      background: #fff;
      text-align: center;
      cursor: pointer;
    }
    .user-option:hover, .user-option:active { border-color: var(--brand); background: var(--brand-pale); }
    .avatar {
      display: grid;
      width: 46px;
      height: 46px;
      margin: 0 auto 7px;
      place-items: center;
      color: var(--brand-dark);
      border: 1px solid #c9ded7;
      border-radius: 50%;
      background: var(--brand-soft);
      font-size: 15px;
      font-weight: 800;
    }
    .user-option strong { display: block; overflow: hidden; font-size: 15px; text-overflow: ellipsis; white-space: nowrap; }
    .mini-role {
      display: inline-flex;
      min-height: 22px;
      align-items: center;
      margin-top: 5px;
      padding: 1px 8px;
      color: var(--brand-dark);
      border-radius: 99px;
      background: var(--brand-soft);
      font-size: 10.5px;
      font-weight: 700;
    }
    .mini-role.family { color: var(--family); background: var(--family-soft); }
    .pin-person {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 17px;
      padding: 10px 12px;
      border-radius: 13px;
      background: var(--brand-pale);
    }
    .pin-person .avatar { width: 39px; height: 39px; margin: 0; font-size: 13px; }
    .pin-person strong { display: block; font-size: 14px; }
    .pin-person small { color: var(--muted); font-size: 11px; }
    .pin-dots {
      display: flex;
      justify-content: center;
      gap: 15px;
      min-height: 42px;
      margin: 4px 0 16px;
      align-items: center;
    }
    .pin-dot {
      width: 17px;
      height: 17px;
      border: 2px solid #92a49e;
      border-radius: 50%;
      background: #fff;
      transition: transform .15s, background .15s, border-color .15s;
    }
    .pin-dot.filled { border-color: var(--brand); background: var(--brand); transform: scale(1.08); }
    .pin-wrap.shake { animation: shake .38s ease; }
    .pin-error { min-height: 24px; margin: -7px 0 6px; color: var(--important); font-size: 12.5px; font-weight: 700; text-align: center; }
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      max-width: 314px;
      margin: 0 auto;
    }
    .key {
      min-height: 57px;
      color: var(--ink);
      border: 1px solid var(--line-strong);
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 2px 5px rgba(30,60,51,.05);
      font-size: 22px;
      font-weight: 700;
      cursor: pointer;
    }
    .key:active { background: var(--brand-soft); transform: scale(.98); }
    .key.blank { visibility: hidden; }
    .key.delete { color: var(--muted); font-size: 0; }
    .demo-hint {
      width: 100%;
      max-width: 438px;
      margin: 15px 2px 0;
      padding: 10px 12px;
      color: #5d5b50;
      border-radius: 11px;
      background: rgba(246,240,225,.86);
      font-size: 11.5px;
      text-align: center;
    }
    .security-note {
      display: flex;
      width: 100%;
      max-width: 438px;
      align-items: flex-start;
      justify-content: center;
      gap: 6px;
      margin-top: 9px;
      color: #52645e;
      font-size: 10.5px;
      line-height: 1.55;
      text-align: center;
    }
    .security-note .icon { width: 14px; height: 14px; margin-top: 1px; color: var(--brand-dark); }
    .lock-screen .login-panel { max-width: 420px; }
    .lock-message {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin: 0 0 15px;
      padding: 10px 11px;
      color: #4b5f58;
      border: 1px solid #d4e2dd;
      border-radius: 12px;
      background: #f0f7f4;
      font-size: 12px;
    }
    .lock-message .icon { margin-top: 1px; color: var(--brand-dark); }
    .lock-screen .pin-person { margin-bottom: 12px; }

    /* App shell */
    .demo-strip {
      padding: 5px 10px;
      color: #e4efeb;
      background: #263c35;
      font-size: 10.5px;
      font-weight: 600;
      text-align: center;
      letter-spacing: .02em;
    }
    .app-header {
      position: sticky;
      top: 0;
      z-index: 40;
      padding: 10px 14px;
      color: var(--ink);
      border-bottom: 1px solid #cfdcd7;
      background: rgba(255,255,255,.97);
      box-shadow: 0 4px 14px rgba(18,75,65,.08);
      backdrop-filter: blur(10px);
    }
    .header-row { display: flex; align-items: center; justify-content: space-between; gap: 9px; }
    .header-brand { display: flex; min-width: 0; align-items: center; gap: 9px; }
    .corp-logo {
      position: relative;
      display: grid;
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      place-items: center;
      overflow: hidden;
      color: #fff;
      border-radius: 13px 13px 13px 5px;
      background: linear-gradient(145deg, #0e5147, #237a69);
      box-shadow: 0 6px 14px rgba(14,81,71,.2);
      font-family: Arial, sans-serif;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -.08em;
    }
    .corp-logo::after {
      content: "";
      position: absolute;
      right: 6px;
      bottom: 6px;
      width: 11px;
      height: 3px;
      border-radius: 99px;
      background: #efd5a1;
      transform: rotate(-38deg);
      box-shadow: 0 -4px 0 rgba(239,213,161,.58);
    }
    .header-copy { min-width: 0; }
    .header-brand strong {
      display: block;
      overflow: hidden;
      color: var(--brand-dark);
      font-size: 14px;
      line-height: 1.35;
      letter-spacing: .025em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .header-company { display: block; max-width: 245px; overflow: hidden; color: var(--muted); font-size: 10.5px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .logout-btn {
      display: inline-flex;
      min-width: 44px;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 0 9px;
      color: var(--brand-dark);
      border: 1px solid #b9d1ca;
      border-radius: 11px;
      background: var(--brand-pale);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .logout-btn:hover, .logout-btn:active { background: var(--brand-soft); }
    .app-main { min-height: calc(100dvh - 135px); padding: 17px 14px calc(93px + env(safe-area-inset-bottom)); }
    .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin: 0 2px 14px; }
    .eyebrow { margin: 0 0 2px; color: var(--brand-dark); font-size: 11px; font-weight: 800; letter-spacing: .06em; }
    .page-head h1 { margin: 0; font-size: 21px; line-height: 1.45; letter-spacing: .01em; }
    .page-head p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .page-symbol {
      display: grid;
      width: 44px;
      height: 44px;
      flex: 0 0 auto;
      place-items: center;
      color: var(--brand-dark);
      border: 1px solid #cce0d9;
      border-radius: 14px;
      background: var(--brand-soft);
    }
    .card {
      margin-bottom: 11px;
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: var(--shadow-sm);
    }
    .section-title {
      display: flex;
      min-height: 35px;
      align-items: center;
      justify-content: space-between;
      gap: 9px;
      margin: 18px 3px 7px;
      color: var(--ink);
      font-size: 14px;
      font-weight: 800;
    }
    .section-title small { color: var(--muted); font-size: 11px; font-weight: 600; }
    .empty {
      padding: 38px 12px;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }

    /* Home */
    .welcome {
      position: relative;
      overflow: hidden;
      padding: 20px 18px;
      color: #fff;
      border-radius: 22px;
      background: linear-gradient(135deg, #176b5d 0%, #267d6e 62%, #3a8b79 100%);
      box-shadow: 0 11px 28px rgba(23,107,93,.22);
    }
    .welcome::after {
      content: "";
      position: absolute;
      right: -42px;
      bottom: -65px;
      width: 170px;
      height: 170px;
      border: 22px solid rgba(255,255,255,.09);
      border-radius: 50%;
    }
    .welcome-date { position: relative; z-index: 1; opacity: .9; font-size: 12px; font-weight: 600; }
    .welcome h1 { position: relative; z-index: 1; margin: 5px 0 2px; font-size: 22px; line-height: 1.45; }
    .welcome p { position: relative; z-index: 1; margin: 4px 0 0; opacity: .92; font-size: 13px; }
    .feature-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; }
    .feature-card {
      position: relative;
      min-height: 142px;
      padding: 16px 13px 13px;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fff;
      box-shadow: var(--shadow-sm);
      text-align: left;
      cursor: pointer;
    }
    .feature-card:active { transform: translateY(1px); background: var(--brand-pale); }
    .feature-icon {
      display: grid;
      width: 42px;
      height: 42px;
      margin-bottom: 10px;
      place-items: center;
      color: var(--brand-dark);
      border-radius: 13px;
      background: var(--brand-soft);
    }
    .feature-card.posts .feature-icon { color: #895020; background: #fff0e1; }
    .feature-card.renraku .feature-icon { color: #3a5f88; background: #ebf1f8; }
    .feature-card.admin .feature-icon { color: var(--family); background: var(--family-soft); }
    .feature-card.export .feature-icon { color: #7b5520; background: #f8eedc; }
    .feature-card strong { display: block; font-size: 15px; }
    .feature-card small { display: block; margin-top: 3px; color: var(--muted); font-size: 10.5px; line-height: 1.5; }
    .count-badge {
      display: inline-flex;
      min-width: 25px;
      min-height: 25px;
      align-items: center;
      justify-content: center;
      padding: 0 7px;
      color: #fff;
      border: 2px solid #fff;
      border-radius: 99px;
      background: var(--important);
      font-size: 11px;
      font-weight: 800;
    }
    .feature-card .count-badge { position: absolute; top: 10px; right: 10px; }
    .home-note { display: flex; gap: 10px; margin-top: 13px; padding: 12px 13px; color: #4d5f59; border: 1px solid #d7e3df; border-radius: 14px; background: #f3f8f6; font-size: 12px; }

    /* Attendance */
    .clock-card {
      padding: 0;
      overflow: hidden;
      border-top: 4px solid var(--brand);
      text-align: center;
    }
    .clock-main { padding: 18px 16px 14px; }
    .clock-date { color: var(--muted); font-size: 12px; font-weight: 600; }
    .clock-time { margin: 1px 0 13px; color: var(--ink); font-variant-numeric: tabular-nums; font-size: 38px; font-weight: 800; line-height: 1.3; letter-spacing: .03em; }
    .punch-status {
      display: inline-flex;
      min-height: 29px;
      align-items: center;
      gap: 6px;
      margin-bottom: 15px;
      padding: 2px 11px;
      color: var(--muted);
      border-radius: 99px;
      background: #f0f3f2;
      font-size: 11px;
      font-weight: 700;
    }
    .punch-status.working { color: var(--brand-dark); background: var(--brand-soft); }
    .record-summary {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: #f8faf9;
    }
    .record-time { padding: 11px 8px 10px; }
    .record-time + .record-time { border-left: 1px solid var(--line); }
    .record-time span { display: block; color: var(--muted); font-size: 10.5px; font-weight: 700; }
    .record-time strong { display: block; margin-top: 1px; color: var(--ink); font-size: 17px; font-variant-numeric: tabular-nums; }
    .record-time strong.pending { color: var(--subtle); font-size: 13px; }
    .record-time.overtime strong.positive { color: var(--incident); }
    .punch-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 14px 15px 16px; }
    .punch-btn {
      min-height: 74px;
      color: #fff;
      border: 0;
      border-radius: 16px;
      background: var(--brand);
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }
    .punch-btn.out { color: var(--brand-dark); border: 1.5px solid var(--brand); background: #fff; }
    .punch-btn:disabled { color: #8b9994; border-color: #d7dfdc; background: #e7ecea; cursor: not-allowed; }
    .punch-help { margin: -5px 15px 15px; color: var(--muted); font-size: 10.5px; text-align: center; }
    .attendance-row { display: grid; grid-template-columns: 42px minmax(0,1fr) auto; gap: 10px; align-items: center; }
    .attendance-person-btn {
      width: 100%;
      color: var(--ink);
      font: inherit;
      text-align: left;
      cursor: pointer;
      transition: border-color .16s, background .16s, transform .16s;
    }
    .attendance-person-btn:hover { border-color: #9fc6bb; background: var(--brand-pale); }
    .attendance-person-btn:active { transform: translateY(1px); }
    .attendance-row .avatar { width: 42px; height: 42px; margin: 0; font-size: 13px; }
    .attendance-name { font-size: 13px; font-weight: 800; }

    .work-record {
      display: grid;

      padding: 8px 11px;

    .work-history-empty { padding: 26px 12px; color: var(--muted); font-size: 12px; text-align: center; }
    .detail-file-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 13px; }

      display: inline-flex;

      background: #fff;

      font-weight: 800;

      60% { transform: translateX(-6px); }

        const returnScrollY = state.lockedScrollY;

        state.lockPin = "";
        state.lockError = "";
        state.view = returnView;
        document.getElementById("lockRoot").classList.add("hidden");
        document.getElementById("shell").classList.remove("hidden");
        renderApp();
        requestAnimationFrame(() => window.scrollTo({ top:returnScrollY, behavior:"auto" }));
        resetInactivityTimer();
        showToast("ロックを解除しました");
      } else {
        state.lockPin = "";
        state.lockError = "PINが違います。もう一度入力してください。";
        renderLockScreen();
        setTimeout(() => document.getElementById("lockPinWrap")?.classList.remove("shake"), 420);
      }
    }
    function logout() {
      closeAttendanceDetail();
      clearTimeout(inactivityTimer);
      inactivityTimer = null;
      state.userId = null;
      state.view = "home";
      state.viewHistory = [];
      state.locked = false;
      state.lockPin = "";
      state.lockError = "";
      state.loginStep = "company";
      state.loginCompanyId = null;
      state.loginUserId = null;
      state.pin = "";
      state.pinError = "";
      document.getElementById("lockRoot").classList.add("hidden");
      history.replaceState(null, "", location.pathname + location.search);
      renderLogin();
    }

    /* =========================
       App routing and shell
       ========================= */
    function navItems() {
      const u = me();
      if (!u) return [];
      if (u.role === "family") return [{ id:"renraku", icon:"book", label:"連絡帳" }];
      const items = [
        { id:"home", icon:"home", label:"ホーム" },
        { id:"kintai", icon:"clock", label:"出退勤" },
        { id:"workrecords", icon:"export", label:"勤務記録" },
        { id:"posts", icon:"note", label:"申し送り" },
        { id:"renraku", icon:"book", label:"連絡帳" }
      ];
      if (u.role === "admin") items.push({ id:"admin", icon:"admin", label:"管理" });
      return items;
    }
    function setRoute(view, skipHistory = false) {
      if (!allowedViews().includes(view)) view = me()?.role === "family" ? "renraku" : "home";
      if (!skipHistory && state.view !== view && allowedViews().includes(state.view)) {
        state.viewHistory.push(state.view);
        if (state.viewHistory.length > 12) state.viewHistory.shift();
      }
      state.view = view;
      const next = `#/${view}`;
      if (location.hash !== next) location.hash = next;
      else renderApp();
    }
    function goBack() {
      let previous = null;
      while (state.viewHistory.length && !previous) {
        const candidate = state.viewHistory.pop();
        if (candidate !== state.view && allowedViews().includes(candidate)) previous = candidate;
      }
      setRoute(previous || (me()?.role === "family" ? "renraku" : "home"), true);
    }
    function routeFromHash() {
      if (!me() || state.locked) return;
      const route = location.hash.replace(/^#\//,"") || (me().role === "family" ? "renraku" : "home");
      state.view = allowedViews().includes(route) ? route : (me().role === "family" ? "renraku" : "home");
      renderApp();
    }
    function renderApp() {
      const u = me();
      if (!u) { renderLogin(); return; }
      document.getElementById("loginRoot").classList.add("hidden");
      document.getElementById("lockRoot").classList.add("hidden");
      document.getElementById("shell").classList.remove("hidden");
      document.getElementById("headerCompany").textContent = `つなぐノート｜${myCompany().name}｜${u.name}`;
      const renderers = { home:renderHome, kintai:renderKintai, workrecords:renderWorkRecords, posts:renderPosts, renraku:renderRenraku, admin:renderAdmin, export:renderExport };
      if (!allowedViews().includes(state.view)) state.view = u.role === "family" ? "renraku" : "home";
      const returnsToLogin = state.view === "home" || u.role === "family";
      const backControl = returnsToLogin
        ? `<button class="page-back-btn" type="button" onclick="logout()">${icon("back","icon icon-sm")}ログイン画面に戻る</button>`
        : `<button class="page-back-btn" type="button" onclick="goBack()">${icon("back","icon icon-sm")}ひとつ前に戻る</button>`;
      document.getElementById("mainContent").innerHTML = backControl + renderers[state.view]();
      renderNav();
      updateClock();
      window.scrollTo({ top:0, behavior:"auto" });
    }
    function renderNav() {
      const unread = unreadCount();
      document.getElementById("bottomNav").innerHTML = navItems().map(item => `
        <button class="nav-item ${state.view === item.id ? "active" : ""}" type="button" onclick="setRoute('${item.id}')"
          aria-current="${state.view === item.id ? "page" : "false"}">
          ${icon(item.icon)}
          <span>${item.label}</span>
          ${item.id === "posts" && unread ? `<span class="nav-badge" aria-label="未読${unread}件">${unread}</span>` : ""}
        </button>`).join("");
    }
    function pageHead(eyebrow, title, desc, iconName) {
      return `<div class="page-head"><div><p class="eyebrow">${eyebrow}</p><h1>${title}</h1>${desc ? `<p>${desc}</p>` : ""}</div><span class="page-symbol">${icon(iconName,"icon icon-lg")}</span></div>`;
    }

    /* =========================
       Home
       ========================= */
    function renderHome() {
      const u = me();
      const unread = unreadCount();
      const cards = [
        { id:"kintai", icon:"clock", title:"出退勤", desc:"出勤・退勤をかんたん打刻", cls:"" },
        { id:"workrecords", icon:"export", title:"勤務記録", desc:u.role === "admin" ? "職員ごとの勤務実績を確認・修正" : "自分の勤務実績を月ごとに確認", cls:"" },
        { id:"posts", icon:"note", title:"申し送り", desc:"重要事項とヒヤリハットを共有", cls:"posts", badge:unread },
        { id:"renraku", icon:"book", title:"連絡帳", desc:"ご家族へ日々の様子をお届け", cls:"renraku" }
      ];
      if (u.role === "admin") cards.push({ id:"admin", icon:"admin", title:"管理", desc:"職員・家族アカウントを管理", cls:"admin" });
      if (u.role === "admin") cards.push({ id:"export", icon:"export", title:"帳票出力", desc:"月ごとの記録を印刷・保存", cls:"export" });
      return `
        <section class="welcome">
          <div class="welcome-date">${longDate()}</div>
          <h1>${greeting()}、${escapeHTML(u.name.split(" ")[0])}さん</h1>
          <p>今日も安全を第一に、よろしくお願いします。</p>
        </section>
        <div class="section-title"><span>今日のメニュー</span>${unread ? `<small>未読の申し送り ${unread}件</small>` : "<small>未読はありません</small>"}</div>
        <div class="feature-grid">
          ${cards.map(c => `<button class="feature-card ${c.cls}" type="button" onclick="setRoute('${c.id}')">
            ${c.badge ? `<span class="count-badge" aria-label="未読${c.badge}件">${c.badge}</span>` : ""}
            <span class="feature-icon">${icon(c.icon,"icon icon-lg")}</span>
            <strong>${c.title}</strong><small>${c.desc}</small>
          </button>`).join("")}
        </div>
        <div class="home-note">${icon("info","icon icon-sm")}<span>申し送りは確認後に「確認しました」を押すと、チームへ既読状況が共有されます。</span></div>`;
    }

    /* =========================
       Attendance
       ========================= */
    const STANDARD_WORK_MINUTES = 8 * 60;
    function attendanceFor(userId) {
      return DB.attendance.find(a => a.userId === userId && a.date === todayKey());
    }
    function renderKintai() {
      const u = me();
      const mine = attendanceFor(u.id);
      const status = !mine?.start ? "未出勤" : mine.end ? "退勤済み" : "勤務中";
      const staff = DB.users.filter(x => x.companyId === u.companyId && x.role !== "family");
      return `
        ${pageHead("ATTENDANCE","出退勤","現在時刻を確認して打刻してください。","clock")}
        <section class="card clock-card">
          <div class="clock-main">
            <div class="clock-date" id="clockDate">${longDate()}</div>
            <div class="clock-time" id="clockTime">--:--:--</div>
            <div class="punch-status ${status === "勤務中" ? "working" : ""}">${icon("clock","icon icon-sm")}現在の状態：${status}</div>
          </div>
          <div class="record-summary" aria-label="本日の打刻時刻">
            <div class="record-time"><span>出勤時刻</span><strong class="${mine?.start ? "" : "pending"}">${mine?.start || "未打刻"}</strong></div>
            <div class="record-time"><span>退勤時刻</span><strong class="${mine?.end ? "" : "pending"}">${mine?.end || "未打刻"}</strong></div>
            <div class="record-time overtime"><span>超過時間</span><strong id="overtimeToday" class="${overtimeMinutes(mine,true) ? "positive" : ""}">${overtimeMinutesLabel(mine,true)}</strong></div>
          </div>
          <div class="punch-actions">
            <button class="punch-btn" type="button" onclick="punch('start')" ${mine?.start ? "disabled" : ""}>出勤を打刻</button>
            <button class="punch-btn out" type="button" onclick="punch('end')" ${!mine?.start || mine?.end ? "disabled" : ""}>退勤を打刻</button>
          </div>
          <div class="punch-help">ボタンを1回押すと、現在時刻で記録されます。</div>
        </section>
        <div class="section-title"><span>本日の出勤状況</span><small>${staff.filter(s => attendanceFor(s.id)?.start && !attendanceFor(s.id)?.end).length}名が勤務中</small></div>
        <div class="attendance-grid">${staff.map(person => {
          const a = attendanceFor(person.id);
          const cls = !a?.start ? "none" : a.end ? "out" : "in";
          const label = !a?.start ? "未出勤" : a.end ? "退勤済み" : "勤務中";
          const times = !a?.start ? "記録なし" : `${a.start} 〜 ${a.end || "勤務中"}`;
          const overtime = overtimeMinutes(a, true);
          const canOpenHistory = u.role === "admin" || person.id === u.id;
          const content = `
            <span class="avatar">${escapeHTML(initial(person.name))}</span>
            <span><span class="attendance-name">${escapeHTML(person.name)}</span><span class="attendance-role">${escapeHTML(person.roleLabel)}</span></span>
            <span class="attendance-time"><span class="work-label ${cls}">${label}</span><br>${times}<span class="overtime-chip ${overtime ? "positive" : ""}">${overtime ? `超過 ${minutesLabel(overtime)}` : "超過なし"}</span>${canOpenHistory ? `<span class="record-link">勤務記録 ${icon("arrow","icon")}</span>` : ""}</span>`;
          return canOpenHistory
            ? `<button class="card attendance-row attendance-person-btn" type="button" onclick="openAttendanceDetail('${person.id}')" aria-label="${escapeHTML(person.name)}さんの勤務記録を開く">${content}</button>`
            : `<div class="card attendance-row">${content}</div>`;
        }).join("")}</div>`;
    }
    function updateClock() {
      const el = document.getElementById("clockTime");
      if (!el) return;
      const now = new Date();
      el.textContent = new Intl.DateTimeFormat("ja-JP", { hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:false }).format(now);
      const date = document.getElementById("clockDate");
      if (date) date.textContent = longDate();
      const overtime = document.getElementById("overtimeToday");
      const current = me();
      if (overtime && current) {
        const minutes = overtimeMinutes(attendanceFor(current.id), true);
        overtime.textContent = minutesLabel(minutes);
        overtime.classList.toggle("positive", minutes > 0);
      }
    }
    function punch(type) {
      const u = me();
      if (!u || u.role === "family") return;
      let row = attendanceFor(u.id);
      if (type === "start") {
        if (row?.start) return;
        if (!row) {
          row = { id:`a${Date.now()}`, companyId:u.companyId, userId:u.id, date:todayKey(), start:null, end:null };
          DB.attendance.push(row);
        }
        row.start = currentTime();
        showSuccess("出勤を記録しました");
      } else {
        if (!row?.start || row.end) return;
        row.end = currentTime();
        showSuccess("退勤を記録しました");
      }
      renderApp();
    }
    function attendanceMinutes(record) {
      if (!record?.start || !record?.end) return 0;
      const [startHour,startMinute] = record.start.split(":").map(Number);
      const [endHour,endMinute] = record.end.split(":").map(Number);
      const difference = (endHour * 60 + endMinute) - (startHour * 60 + startMinute);
      return difference >= 0 ? difference : difference + (24 * 60);
    }
    function activeAttendanceMinutes(record) {
      if (!record?.start) return 0;
      if (record.end) return attendanceMinutes(record);
      if (record.date !== todayKey()) return 0;
      const [startHour,startMinute] = record.start.split(":").map(Number);
      const now = new Date();
      const difference = (now.getHours() * 60 + now.getMinutes()) - (startHour * 60 + startMinute);
      return difference >= 0 ? difference : difference + (24 * 60);
    }
    function overtimeMinutes(record, includeActive = false) {
      const worked = record?.end ? attendanceMinutes(record) : includeActive ? activeAttendanceMinutes(record) : 0;
      return Math.max(0, worked - STANDARD_WORK_MINUTES);
    }
    function minutesLabel(minutes) {
      const value = Math.max(0, Number(minutes) || 0);
      if (!value) return "0分";
      const hours = Math.floor(value / 60);
      const rest = value % 60;
      return `${hours ? `${hours}時間` : ""}${rest ? `${rest}分` : ""}`;
    }
    function overtimeMinutesLabel(record, includeActive = false) {
      return minutesLabel(overtimeMinutes(record, includeActive));
    }
    function durationLabel(record) {
      if (!record?.start) return "記録なし";
      if (!record.end) return "勤務中";
      const minutes = attendanceMinutes(record);
      return `${Math.floor(minutes / 60)}時間${minutes % 60 ? `${minutes % 60}分` : ""}`;
    }
    function historyDateLabel(dateString) {
      if (dateString === todayKey()) return "今日";
      return new Intl.DateTimeFormat("ja-JP", { month:"numeric", day:"numeric", weekday:"short" }).format(new Date(`${dateString}T00:00:00`));
    }
    function lastTwelveMonths() {
      return Array.from({ length:12 }, (_, offset) => {
        const date = new Date();
        date.setDate(1);
        date.setMonth(date.getMonth() - offset);
        return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}`;
      });
    }
    function openAttendanceDetail(userId) {
      const person = userById(userId);
      const current = me();
      if (!person || !current || person.companyId !== current.companyId || person.role === "family" || (current.role !== "admin" && person.id !== current.id)) return;
      state.attendanceUserId = userId;
      state.attendanceMonth = todayKey().slice(0,7);
      renderAttendanceDetail();
      const modal = document.getElementById("attendanceModal");
      modal.classList.add("open");
      modal.setAttribute("aria-hidden","false");
      setTimeout(() => document.getElementById("attendanceMonthSelect")?.focus(), 0);
    }
    function setAttendanceDetailMonth(value) {
      if (!state.attendanceUserId || !lastTwelveMonths().includes(value)) return;
      state.attendanceMonth = value;
      renderAttendanceDetail();
      setTimeout(() => document.getElementById("attendanceMonthSelect")?.focus(), 0);
    }
    function renderAttendanceDetail() {
      const person = userById(state.attendanceUserId);
      const current = me();
      if (!person || !current || person.companyId !== current.companyId || person.role === "family" || (current.role !== "admin" && person.id !== current.id)) return;
      const records = DB.attendance
        .filter(row => row.userId === person.id && row.date.startsWith(state.attendanceMonth))
        .sort((a,b) => b.date.localeCompare(a.date));
      const totalMinutes = records.reduce((sum,record) => sum + attendanceMinutes(record), 0);
      const totalLabel = `${Math.floor(totalMinutes / 60)}時間${totalMinutes % 60}分`;
      const overtimeTotal = records.reduce((sum,record) => sum + overtimeMinutes(record), 0);
      const today = attendanceFor(person.id);
      const todayStatus = !today?.start ? "未出勤" : today.end ? "退勤済み" : "勤務中";
      document.getElementById("attendanceDetail").innerHTML = `
        <div class="detail-person">
          <span class="avatar">${escapeHTML(initial(person.name))}</span>
          <span><h2 id="attendanceDetailTitle">${escapeHTML(person.name)}</h2><p>${escapeHTML(person.roleLabel)}｜本日 ${todayStatus}</p></span>
        </div>
        <div class="detail-month-control">
          <label for="attendanceMonthSelect">確認する月（過去12か月）</label>
          <select class="detail-month-select" id="attendanceMonthSelect" onchange="setAttendanceDetailMonth(this.value)">
            ${lastTwelveMonths().map(month => `<option value="${month}" ${month === state.attendanceMonth ? "selected" : ""}>${monthLabel(month)}</option>`).join("")}
          </select>
        </div>
        <div class="detail-summary">
          <div class="detail-stat"><span>${monthLabel(state.attendanceMonth)}の出勤日</span><strong>${records.length}日</strong></div>
          <div class="detail-stat"><span>勤務時間合計</span><strong>${totalLabel}</strong></div>
          <div class="detail-stat"><span>超過時間合計</span><strong>${minutesLabel(overtimeTotal)}</strong></div>
        </div>
        <h3 class="history-title">${monthLabel(state.attendanceMonth)}の勤務記録</h3>
        <div class="work-history">
          ${records.length ? records.map(record => `<div class="work-record">
            <span class="record-date">${historyDateLabel(record.date)}</span>
            <span class="record-cell">出勤<strong>${record.start || "--:--"}</strong></span>
            <span class="record-cell">退勤<strong>${record.end || "--:--"}</strong></span>
            <span class="record-cell">勤務<strong>${durationLabel(record)}</strong></span>
          </div>`).join("") : `<div class="work-history-empty">この月の勤務記録はありません。</div>`}
        </div>
        <div class="detail-file-actions">
          <button class="detail-file-btn primary" type="button" onclick="exportIndividualAttendanceCsv('${person.id}','${state.attendanceMonth}')">${icon("export","icon icon-sm")}CSV保存</button>
          <button class="detail-file-btn" type="button" onclick="openIndividualAttendancePrint('${person.id}','${state.attendanceMonth}')">${icon("print","icon icon-sm")}印刷／PDF</button>
        </div>
        <button class="detail-close" id="attendanceDetailClose" type="button" onclick="closeAttendanceDetail()">閉じる</button>`;
    }
    function closeAttendanceDetail() {
      const modal = document.getElementById("attendanceModal");
      if (!modal) return;
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden","true");
      state.attendanceUserId = null;
    }

    /* =========================
       Work records
       ========================= */
    function workRecordTarget() {
      const current = me();
      if (!current || current.role === "family") return null;
      if (current.role !== "admin") return current;
      const selected = userById(state.workRecordUserId);
      if (selected && selected.companyId === current.companyId && selected.role !== "family") return selected;
      state.workRecordUserId = current.id;
      return current;
    }
    function setWorkRecordUser(userId) {
      const current = me();
      const target = userById(userId);
      if (!current || current.role !== "admin" || !target || target.companyId !== current.companyId || target.role === "family") return;
      state.workRecordUserId = target.id;
      state.workRecordEditingId = null;
      renderApp();
      requestAnimationFrame(() => document.getElementById("workRecordDetails")?.scrollIntoView({ behavior:"smooth", block:"start" }));
    }
    function setWorkRecordMonth(month) {
      if (!lastTwelveMonths().includes(month)) return;
      state.workRecordMonth = month;
      state.workRecordEditingId = null;
      renderApp();
    }
    function startWorkRecordCreate() {
      if (me()?.role !== "admin" || !workRecordTarget()) return;
      state.workRecordEditingId = "new";
      renderApp();
    }
    function editWorkRecord(recordId) {
      const current = me();
      const target = workRecordTarget();
      const record = DB.attendance.find(item => item.id === recordId);
      if (!current || current.role !== "admin" || !target || !record || record.companyId !== current.companyId || record.userId !== target.id) return;
      state.workRecordEditingId = record.id;
      renderApp();
    }
    function cancelWorkRecordEdit() {
      state.workRecordEditingId = null;
      renderApp();
    }
    function workRecordMonthBounds(month) {
      const [year, value] = month.split("-").map(Number);
      const lastDay = new Date(year, value, 0).getDate();
      return { min:`${month}-01`, max:`${month}-${String(lastDay).padStart(2,"0")}` };
    }
    function renderWorkRecordEditor(target) {
      if (me()?.role !== "admin" || !state.workRecordEditingId) return "";
      const record = state.workRecordEditingId === "new"
        ? null
        : DB.attendance.find(item => item.id === state.workRecordEditingId && item.userId === target.id);
      if (state.workRecordEditingId !== "new" && !record) return "";
      const bounds = workRecordMonthBounds(state.workRecordMonth);
      const defaultDate = state.workRecordMonth === todayKey().slice(0,7) ? todayKey() : bounds.min;
      return `<section class="card work-record-editor">
        <h2>${record ? "勤務記録を修正" : "勤務記録を追加"}</h2>
        <div class="record-form-grid">
          <div class="record-form-field">
            <label for="workRecordDate">勤務日</label>
            <input class="record-form-input" id="workRecordDate" type="date" min="${bounds.min}" max="${bounds.max}" value="${record?.date || defaultDate}">
          </div>
          <div class="record-form-field">
            <label for="workRecordStart">出勤時刻</label>
            <input class="record-form-input" id="workRecordStart" type="time" value="${record?.start || "08:30"}">
          </div>
          <div class="record-form-field">
            <label for="workRecordEnd">退勤時刻（未打刻なら空欄）</label>
            <input class="record-form-input" id="workRecordEnd" type="time" value="${record?.end || ""}">
          </div>
        </div>
        <div class="record-form-actions">
          <button class="record-form-btn cancel" type="button" onclick="cancelWorkRecordEdit()">キャンセル</button>
          <button class="record-form-btn save" type="button" onclick="saveWorkRecord('${record?.id || "new"}')">保存する</button>
        </div>
      </section>`;
    }
    function saveWorkRecord(recordId) {
      const current = me();
      const target = workRecordTarget();
      if (!current || current.role !== "admin" || !target) return;
      const date = document.getElementById("workRecordDate")?.value || "";
      const start = document.getElementById("workRecordStart")?.value || "";
      const end = document.getElementById("workRecordEnd")?.value || "";
      const validTime = value => value === "" || /^([01]\d|2[0-3]):[0-5]\d$/.test(value);
      const bounds = workRecordMonthBounds(state.workRecordMonth);
      if (date < bounds.min || date > bounds.max || !start || !validTime(start) || !validTime(end)) {
        showToast("勤務日と打刻時刻を確認してください");
        return;
      }
      const duplicate = DB.attendance.find(item => item.userId === target.id && item.date === date && item.id !== recordId);
      if (duplicate) {
        showToast("同じ勤務日の記録がすでにあります");
        return;
      }
      if (recordId === "new") {
        DB.attendance.push({
          id:`manual-${Date.now()}`,
          companyId:current.companyId,
          userId:target.id,
          date,
          start,
          end:end || null
        });
      } else {
        const record = DB.attendance.find(item => item.id === recordId && item.companyId === current.companyId && item.userId === target.id);
        if (!record) return;
        record.date = date;
        record.start = start;
        record.end = end || null;
      }
      state.workRecordEditingId = null;
      renderApp();

    /* =========================

    function setPostType(type) {
      state.postType = type;
      const template = "【状況】\n\n【対応】\n";
      if (type === "incident" && !state.postDraft.trim()) state.postDraft = template;
      if (type === "normal" && state.postDraft === template) state.postDraft = "";
      renderApp();
    }
    function setPostShift(shift) { state.postShift = shift; renderApp(); }
    function setPostResident(id) { state.postResidentId = id || null; renderApp(); }
    function toggleImportant() { state.postImportant = !state.postImportant; renderApp(); }
    function setPostFilter(filter) { state.postFilter = filter; renderApp(); }
    function renderPosts() {
      const u = me();
      const residents = DB.residents.filter(r => r.companyId === u.companyId);
      let posts = DB.posts.filter(p => p.companyId === u.companyId);
      if (state.postFilter === "important") posts = posts.filter(p => p.important);
      if (state.postFilter === "incident") posts = posts.filter(p => p.type === "incident");
      posts = [...posts].sort((a,b) => Number(b.important) - Number(a.important));
      return `
        ${pageHead("HANDOVER","申し送り","勤務交代に必要な情報を、確実に共有します。","note")}
        <section class="card composer">
          <div class="segmented" aria-label="投稿種別">
            <button class="segment ${state.postType === "normal" ? "active" : ""}" type="button" onclick="setPostType('normal')">${icon("note","icon icon-sm")}通常の申し送り</button>
            <button class="segment incident ${state.postType === "incident" ? "active" : ""}" type="button" onclick="setPostType('incident')">${icon("alert","icon icon-sm")}ヒヤリハット</button>
          </div>
          <label class="sr-only" for="postText">申し送り本文</label>
          <textarea class="textarea" id="postText" placeholder="共有したい内容を入力してください" oninput="state.postDraft=this.value">${escapeHTML(state.postDraft)}</textarea>
          <span class="form-label">勤務帯</span>
          <div class="chips">${["早番","日勤","遅番","夜勤"].map(s => `<button class="chip ${state.postShift === s ? "active" : ""}" type="button" onclick="setPostShift('${s}')">${s}</button>`).join("")}</div>
          <span class="form-label">対象の利用者</span>
          <div class="chips">
            <button class="chip ${state.postResidentId === null ? "active" : ""}" type="button" onclick="setPostResident('')">全体</button>
            ${residents.map(r => `<button class="chip ${state.postResidentId === r.id ? "active" : ""}" type="button" onclick="setPostResident('${r.id}')">${escapeHTML(r.name)}</button>`).join("")}
          </div>
          <button class="important-toggle ${state.postImportant ? "on" : ""}" type="button" onclick="toggleImportant()" aria-pressed="${state.postImportant}">
            <span>${icon("flag","icon icon-sm")}重要な申し送りとして目立たせる</span><span class="toggle-ui" aria-hidden="true"></span>
          </button>
          <button class="primary-btn send-btn" type="button" onclick="addPost()">${icon("send","icon icon-sm")}申し送りを送信</button>
        </section>
        <div class="section-title"><span>申し送り一覧</span><small>未読 ${unreadCount()}件</small></div>
        <div class="filter-row" aria-label="申し送りの絞り込み">
          ${[
            ["all","すべて"],["important","重要"],["incident","ヒヤリハット"]
          ].map(f => `<button class="filter-btn ${state.postFilter === f[0] ? "active" : ""}" type="button" onclick="setPostFilter('${f[0]}')">${f[1]}</button>`).join("")}
        </div>
        <div id="postList">
          ${posts.length ? posts.map(renderPostCard).join("") : `<div class="empty">条件に一致する申し送りはありません。</div>`}
        </div>`;
    }
    function renderPostCard(post) {
      const u = me();
      const author = userById(post.authorId);
      const resident = post.residentId ? residentById(post.residentId) : null;
      const read = post.authorId === u.id || post.readBy.includes(u.id);
      return `<article class="card post-card ${post.important ? "important" : ""} ${post.type === "incident" ? "incident" : ""}">
        <div class="post-labels">
          ${post.important ? `<span class="label important">${icon("flag","icon icon-sm")}重要</span>` : ""}
          ${post.type === "incident" ? `<span class="label incident">${icon("alert","icon icon-sm")}ヒヤリハット</span>` : ""}
          <span class="label shift">${escapeHTML(post.shift)}</span>
          <span class="label resident">${escapeHTML(resident ? resident.name : "全体")}</span>
          <span class="post-time">${escapeHTML(post.time)}</span>
        </div>
        <div class="post-body">${escapeHTML(post.text)}</div>
        <div class="post-meta">記入：${escapeHTML(author?.name || "不明")}（${escapeHTML(author?.roleLabel || "")}）</div>
        <div class="read-row">
          <button class="read-btn ${read ? "done" : ""}" type="button" onclick="markRead('${post.id}')" ${read ? "disabled" : ""}>
            ${icon("check","icon icon-sm")}${read ? "確認済み" : "確認しました"}
          </button>
          <span class="read-count">確認 ${post.readBy.length}名</span>
        </div>
      </article>`;
    }
    function addPost() {
      const text = state.postDraft.trim();
      if (!text || text === "【状況】\n\n【対応】") { showToast("本文を入力してください"); return; }
      DB.posts.unshift({
        id:`p${Date.now()}`,
        companyId:me().companyId,
        authorId:me().id,
        type:state.postType,
        shift:state.postShift,
        residentId:state.postResidentId,
        important:state.postImportant,
        text,
        date:todayKey(),
        time:currentTime(),
        readBy:[]
      });
      state.postDraft = "";
      state.postType = "normal";
      state.postImportant = false;
      state.postFilter = "all";
      renderApp();
      showSuccess("申し送りを送信しました");
    }
    function markRead(postId) {
      const post = DB.posts.find(p => p.id === postId);
      const u = me();
      if (!post || !u || post.companyId !== u.companyId) return;
      if (post.authorId !== u.id && !post.readBy.includes(u.id)) {
        post.readBy.push(u.id);
        renderApp();
        showToast("確認済みにしました");
      }
    }

    /* =========================
       Contact book
       ========================= */
    function setRenrakuTab(id) { state.renrakuTab = id; renderApp(); }
    function renderRenraku() {
      const u = me();
      let residents = DB.residents.filter(r => r.companyId === u.companyId);
      if (u.role === "family") residents = residents.filter(r => r.id === u.residentId);
      if (!residents.some(r => r.id === state.renrakuTab)) state.renrakuTab = residents[0]?.id || null;
      const entries = DB.renraku.filter(n => n.companyId === u.companyId && n.residentId === state.renrakuTab);

        ${pageHead("DAILY NOTE","連絡帳", u.role === "family" ? "施設での今日のご様子をお伝えします。" : "利用者様の一日をご家族へ共有します。","book")}
        ${residents.length > 1 ? `<div class="resident-tabs">${residents.map(r => `<button class="resident-tab ${state.renrakuTab === r.id ? "active" : ""}" type="button" onclick="setRenrakuTab('${r.id}')">${escapeHTML(r.name)}様</button>`).join("")}</div>` : ""}
        ${selected ? `<div class="section-title"><span>${escapeHTML(selected.name)}様の記録</span><small>${selected.age}歳・${escapeHTML(selected.care)}</small></div>` : ""}
        ${entries.length ? `<div class="note-grid">${entries.map(n => renderNote(n,u)).join("")}</div>` : `<div class="empty">連絡帳の記録はまだありません。</div>`}`;

    function renderNote(note, u) {
      const author = userById(note.authorId);
      return `<article class="card notebook-card">
        <div class="note-head"><span class="note-date">${escapeHTML(note.date)}</span><span class="note-author">記入<br>${escapeHTML(author?.name || "職員")}</span></div>
        <div class="summary-grid">
          <div class="summary"><strong>${escapeHTML(note.meal)}</strong><span>食事</span></div>
          <div class="summary"><strong>${escapeHTML(note.mood)}</strong><span>ご様子</span></div>
          <div class="summary"><strong>${escapeHTML(note.bath)}</strong><span>入浴</span></div>
        </div>
        <div class="note-body">${escapeHTML(note.text)}</div>
        ${note.replies.map(reply => `<div class="reply-area"><strong>${icon("message","icon icon-sm")}ご家族から｜${escapeHTML(reply.author)}</strong>${escapeHTML(reply.text)}</div>`).join("")}
        ${u.role === "family" ? `<div class="reply-form"><label class="sr-only" for="reply-${note.id}">職員への返信</label><input class="reply-input" id="reply-${note.id}" placeholder="職員へのメッセージ"><button class="reply-submit" type="button" onclick="addReply('${note.id}')">返信する</button></div>` : ""}
      </article>`;
    }
    function addReply(noteId) {
      const note = DB.renraku.find(n => n.id === noteId);
      const input = document.getElementById(`reply-${noteId}`);
      const text = input?.value.trim();
      if (!note || !text || note.companyId !== me().companyId || me().role !== "family") {
        if (!text) showToast("メッセージを入力してください");
        return;
      }
      note.replies.push({ author:me().name, text });
      renderApp();
      showSuccess("返信を送信しました");
    }

    /* =========================
       Administration
       ========================= */
    function renderAdmin() {
      const u = me();
      if (u.role !== "admin") return "";
      const staff = DB.users.filter(x => x.companyId === u.companyId && x.role !== "family");
      const family = DB.users.filter(x => x.companyId === u.companyId && x.role === "family");
      const row = (person, canManage = false) => {
        const isCurrentUser = person.id === u.id;
        const permissionAction = !canManage ? "" : isCurrentUser
          ? `<button class="permission-btn" type="button" disabled>ログイン中</button>`
          : person.role === "admin"
            ? `<button class="permission-btn remove" type="button" onclick="toggleAdminRole('${person.id}')" aria-label="${escapeHTML(person.name)}さんの管理権限を解除">管理権限を解除</button>`
            : `<button class="permission-btn" type="button" onclick="toggleAdminRole('${person.id}')" aria-label="${escapeHTML(person.name)}さんに管理権限を付与">管理権限を付与</button>`;
        return `<div class="card account-row">
          <span class="avatar">${escapeHTML(initial(person.name))}</span>
          <span><span class="account-name">${escapeHTML(person.name)}</span><span class="account-detail">${escapeHTML(person.roleLabel)}</span></span>
          <span class="account-actions">
            <span class="role-badge ${person.role}">${person.role === "admin" ? "管理者" : person.role === "family" ? "家族" : "職員"}</span>

        </div>`;
      };
      return `
        ${pageHead("ADMINISTRATION","管理","施設のアカウントを確認・管理します。","admin")}
        <div class="info-box">${icon("info","icon icon-sm")}<span>管理権限を付与した職員は、「管理」と「帳票出力」を利用できます。変更内容はこのデモを再読み込みすると元に戻ります。</span></div>
        <div class="section-title"><span>職員アカウント</span><small>${staff.length}名</small></div>
        <div class="account-grid">${staff.map(person => row(person, true)).join("")}</div>
        <button class="invite-btn" type="button" onclick="showToast('職員用の招待リンクを発行しました')">${icon("plus","icon icon-sm")}職員を招待する</button>
        <div class="section-title"><span>家族アカウント</span><small>${family.length}名</small></div>
        ${family.length ? `<div class="account-grid">${family.map(row).join("")}</div>` : `<div class="empty">家族アカウントはまだありません。</div>`}
        <button class="invite-btn" type="button" onclick="showToast('家族用の招待リンクを発行しました')">${icon("plus","icon icon-sm")}ご家族を招待する</button>`;
    }
    function toggleAdminRole(userId) {
      const actor = me();
      const target = userById(userId);
      if (!actor || actor.role !== "admin" || !target || target.companyId !== actor.companyId || target.role === "family") return;
      if (target.id === actor.id) {
        showToast("ログイン中の自分の管理権限は解除できません");
        return;
      }
      if (target.role === "admin") {
        target.role = "staff";
        target.roleLabel = target.previousRoleLabel || "介護職員";
        delete target.previousRoleLabel;
        renderApp();
        showSuccess(`${target.name}さんの管理権限を解除しました`);
      } else {
        target.previousRoleLabel = target.roleLabel;
        target.role = "admin";
        target.roleLabel = "管理者";
        renderApp();
        showSuccess(`${target.name}さんに管理権限を付与しました`);
      }
    }

    /* =========================

       ========================= */

      const [year, value] = String(month).split("-");
      return year && value ? `${year}年${Number(value)}月` : month;
    };
    const dateLabel = date => {
      if (!date) return "日付なし";
      return new Intl.DateTimeFormat("ja-JP", { year:"numeric", month:"long", day:"numeric" }).format(new Date(`${date}T00:00:00`));
    };
    const issueDateLabel = () => new Intl.DateTimeFormat("ja-JP", { year:"numeric", month:"long", day:"numeric" }).format(new Date());
    const safeFilename = value => String(value).replace(/[\\/:*?"<>|]/g, "_");
    const csvCell = value => `"${String(value ?? "").replace(/"/g, '""')}"`;
    const printableText = value => escapeHTML(value).replace(/\n/g, "<br>");

    function setExportMonth(value) {
      if (!/^\d{4}-\d{2}$/.test(value)) return;
      state.exportMonth = value;
      renderApp();

      if (!["renraku","posts","attendance"].includes(type)) return;
      state.exportType = type;
      renderApp();
    }
    function setExportResident(id) {
      const resident = residentById(id);
      if (!resident || resident.companyId !== me()?.companyId) return;
      state.exportResidentId = id;
      renderApp();
    }
    function exportRecordCount() {
      const u = me();
      if (!u) return 0;
      if (state.exportType === "renraku") {
        return DB.renraku.filter(note =>
          note.companyId === u.companyId &&
          note.residentId === state.exportResidentId &&
          monthKey(note.dateKey) === state.exportMonth
        ).length;
      }
      if (state.exportType === "posts") {
        return DB.posts.filter(post => post.companyId === u.companyId && monthKey(post.date) === state.exportMonth).length;
      }
      return DB.attendance.filter(row => row.companyId === u.companyId && monthKey(row.date) === state.exportMonth).length;
    }
    function renderExport() {
      const u = me();
      if (!u || u.role !== "admin") return "";
      const residents = DB.residents.filter(r => r.companyId === u.companyId);
      if (!residents.some(r => r.id === state.exportResidentId)) state.exportResidentId = residents[0]?.id || null;
      const selectedResident = residentById(state.exportResidentId);
      const count = exportRecordCount();
      const isCsv = state.exportType === "attendance";
      const csvButtonLabel = "showDirectoryPicker" in window ? "保存先フォルダを選択して保存" : "CSVをダウンロード";

        { id:"attendance", icon:"clock", title:"出退勤記録（CSV）", desc:"職員別の打刻記録をExcel用に保存します" }
      ];
      return `
        ${pageHead("RECORD EXPORT","帳票出力","月ごとの記録を、監査・保管用の帳票として出力します。","export")}

        <section class="export-step">
          <div class="export-step-head"><span class="export-step-number">1</span><span><strong>対象月を選択</strong><small>記録をまとめる月を指定してください</small></span></div>
          <label class="sr-only" for="exportMonth">対象月</label>
          <input class="export-control" id="exportMonth" type="month" value="${escapeHTML(state.exportMonth)}" onchange="setExportMonth(this.value)">
        </section>
        <section class="export-step">
          <div class="export-step-head"><span class="export-step-number">2</span><span><strong>帳票を選択</strong><small>出力したい記録を1つ選んでください</small></span></div>
          <div class="report-options" role="radiogroup" aria-label="出力する帳票">
            ${options.map(option => `<button class="report-option ${state.exportType === option.id ? "active" : ""}" type="button" role="radio" aria-checked="${state.exportType === option.id}" onclick="setExportType('${option.id}')">
              <span class="report-option-icon">${icon(option.icon)}</span>
              <span><strong>${option.title}</strong><small>${option.desc}</small></span>
              <span class="report-check">${icon("check","icon icon-sm")}</span>

          </div>
          ${state.exportType === "renraku" ? `<div class="export-detail">
            <label for="exportResident">対象の利用者</label>
            <select class="export-control" id="exportResident" onchange="setExportResident(this.value)">
              ${residents.map(resident => `<option value="${resident.id}" ${resident.id === state.exportResidentId ? "selected" : ""}>${escapeHTML(resident.name)}様</option>`).join("")}
            </select>
          </div>` : ""}
        </section>
        <section class="export-step">
          <div class="export-step-head"><span class="export-step-number">3</span><span><strong>内容を確認して出力</strong><small>${isCsv ? "CSVファイルとして保存します" : "A4印刷用の新しい画面を開きます"}</small></span></div>
          <div class="export-summary">${icon("info","icon icon-sm")}<span><strong>${escapeHTML(myCompany().name)}</strong><br>${monthLabel(state.exportMonth)}｜${state.exportType === "renraku" ? `${escapeHTML(selectedResident?.name || "")}様｜` : ""}${count}件の記録</span></div>
          <button class="export-action" type="button" onclick="${isCsv ? "saveAttendanceCsv()" : "openPrintPreview()"}">
            ${icon(isCsv && "showDirectoryPicker" in window ? "folder" : isCsv ? "export" : "print","icon icon-sm")}
            ${isCsv ? csvButtonLabel : "印刷用プレビューを開く"}
          </button>
          <p class="export-note">${isCsv ? "BOM付きUTF-8形式で保存するため、Excelでも日本語が文字化けしません。" : "プレビュー画面の「印刷／PDF保存」から保存できます。"}</p>
          ${isCsv ? `<div class="csv-import-panel">
            <strong>出退勤CSVをインポート</strong>

            <input class="sr-only" id="attendanceCsvImport" type="file" accept=".csv,text/csv" onchange="importAttendanceCsvFile(this.files[0]);this.value=''">
            <button class="csv-import-btn" type="button" onclick="document.getElementById('attendanceCsvImport').click()">${icon("plus","icon icon-sm")}CSVファイルを選択</button>
          </div>` : ""}
        </section>`;
    }

    function printDocument(title, reportTitle, content, periodMonth = state.exportMonth) {
      const company = myCompany();
      const popup = window.open("", "_blank");
      if (!popup) {
        showToast("印刷画面を開けませんでした。ポップアップを許可してください");
        return;
      }
      const documentTitle = `${company.name}_${periodMonth}_${title}`;
      popup.document.open();
      popup.document.write(`<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>${escapeHTML(documentTitle)}</title>
  <style>

    .summary-table tr:last-child th, .summary-table tr:last-child td { border-bottom: 0; }

  </style>
</head>
<body>
  <div class="toolbar"><strong>印刷用プレビュー</strong><button type="button" onclick="window.print()">印刷／PDF保存</button></div>
  <main class="paper">
    <header class="report-header"><div><div class="brand">RAYBELL｜つなぐノート</div><h1>${escapeHTML(reportTitle)}</h1></div></header>
    <section class="report-meta">
      <div><span>施設名</span><strong>${escapeHTML(company.name)}</strong></div>
      <div><span>対象期間</span><strong>${monthLabel(periodMonth)}</strong></div>
      <div><span>発行日</span><strong>${issueDateLabel()}</strong></div>
    </section>
    ${content}
    <footer class="print-footer">RAYBELL｜つなぐノート　${escapeHTML(company.name)}</footer>
  </main>
</body>
</html>`);
      popup.document.close();
      popup.focus();
    }

    function openPrintPreview() {
      const u = me();
      if (!u || u.role !== "admin") return;
      if (state.exportType === "renraku") {
        const resident = residentById(state.exportResidentId);
        if (!resident || resident.companyId !== u.companyId) return;
        const notes = DB.renraku
          .filter(note => note.companyId === u.companyId && note.residentId === resident.id && monthKey(note.dateKey) === state.exportMonth)
          .sort((a,b) => String(a.dateKey).localeCompare(String(b.dateKey)));
        const content = `
          <div class="record-head"><span>対象利用者：${escapeHTML(resident.name)}様</span><span>${notes.length}件</span></div>
          ${notes.length ? notes.map(note => {
            const author = userById(note.authorId);
            return `<article class="record">
              <div class="record-head"><span>${dateLabel(note.dateKey)}</span><span>記入者：${escapeHTML(author?.name || "職員")}</span></div>
              <table class="summary-table"><tr><th>食事</th><td>${escapeHTML(note.meal)}</td><th>ご様子</th><td>${escapeHTML(note.mood)}</td><th>入浴</th><td>${escapeHTML(note.bath)}</td></tr></table>
              <div class="record-body">${printableText(note.text)}</div>
              ${note.replies.map(reply => `<div class="reply"><strong>ご家族から｜${escapeHTML(reply.author)}</strong><br>${printableText(reply.text)}</div>`).join("")}
            </article>`;
          }).join("") : `<div class="empty-print">この月の連絡帳記録はありません。</div>`}`;
        printDocument("連絡帳", `連絡帳（月次記録）｜${resident.name}様`, content);
        return;
      }
      if (state.exportType === "posts") {
        const posts = DB.posts
          .filter(post => post.companyId === u.companyId && monthKey(post.date) === state.exportMonth)
          .sort((a,b) => `${a.date}${a.time}`.localeCompare(`${b.date}${b.time}`));
        const rows = posts.map(post => {
          const resident = post.residentId ? residentById(post.residentId) : null;
          const author = userById(post.authorId);
          return `<tr class="${post.type === "incident" ? "incident" : ""}">
            <td>${escapeHTML(post.date)}</td>
            <td>${escapeHTML(post.time)}</td>
            <td class="${post.type === "incident" ? "type-incident" : ""}">${post.type === "incident" ? "ヒヤリハット" : "通常"}</td>
            <td>${escapeHTML(resident?.name || "全体")}</td>
            <td>${printableText(post.text)}</td>
            <td>${escapeHTML(author?.name || "不明")}</td>
          </tr>`;
        }).join("");
        const content = posts.length ? `<table class="list-table">
          <colgroup><col style="width:11%"><col style="width:8%"><col style="width:13%"><col style="width:14%"><col style="width:40%"><col style="width:14%"></colgroup>
          <thead><tr><th>日付</th><th>時間</th><th>種別</th><th>対象利用者</th><th>本文</th><th>記入者</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>` : `<div class="empty-print">この月の申し送り記録はありません。</div>`;
        printDocument("申し送り・ヒヤリハット一覧", "申し送り・ヒヤリハット一覧", content);
      }
    }

    function individualAttendanceRecords(userId, month) {
      const current = me();
      const person = userById(userId);
      if (!current || !person || person.companyId !== current.companyId || person.role === "family" || (current.role !== "admin" && person.id !== current.id) || !/^\d{4}-\d{2}$/.test(month)) return null;
      return DB.attendance
        .filter(row => row.userId === person.id && monthKey(row.date) === month)
        .sort((a,b) => a.date.localeCompare(b.date));
    }
    function individualAttendanceCsvData(userId, month) {
      const person = userById(userId);
      const records = individualAttendanceRecords(userId, month);
      if (!person || records === null) return null;
      const lines = [
        ["職員名","役割","日付","出勤時刻","退勤時刻","勤務時間","超過時間"],
        ...records.map(row => [person.name, person.roleLabel, row.date, row.start || "", row.end || "", durationLabel(row), overtimeMinutesLabel(row)])
      ];
      return lines.map(line => line.map(csvCell).join(",")).join("\r\n");
    }
    async function exportIndividualAttendanceCsv(userId, month) {
      const person = userById(userId);
      const csv = individualAttendanceCsvData(userId, month);
      if (!person || csv === null) return;
      const filename = safeFilename(`つなぐノート_${myCompany().name}_${person.name}_${month}_勤務履歴.csv`);
      await saveCsvFile(csv, filename);
    }
    function openIndividualAttendancePrint(userId, month) {
      const person = userById(userId);
      const records = individualAttendanceRecords(userId, month);
      if (!person || records === null) return;
      const totalMinutes = records.reduce((sum, record) => sum + attendanceMinutes(record), 0);
      const totalLabel = `${Math.floor(totalMinutes / 60)}時間${totalMinutes % 60}分`;
      const overtimeTotal = records.reduce((sum, record) => sum + overtimeMinutes(record), 0);
      const rows = records.map(record => `<tr>
        <td>${escapeHTML(record.date)}</td>
        <td>${escapeHTML(record.start || "--:--")}</td>
        <td>${escapeHTML(record.end || "--:--")}</td>
        <td>${escapeHTML(durationLabel(record))}</td>
        <td>${escapeHTML(overtimeMinutesLabel(record))}</td>
      </tr>`).join("");
      const content = `
        <div class="record-head"><span>職員：${escapeHTML(person.name)}（${escapeHTML(person.roleLabel)}）</span><span>出勤 ${records.length}日｜合計 ${totalLabel}｜超過 ${minutesLabel(overtimeTotal)}</span></div>
        ${records.length ? `<table class="list-table">
          <colgroup><col style="width:28%"><col style="width:18%"><col style="width:18%"><col style="width:18%"><col style="width:18%"></colgroup>
          <thead><tr><th>日付</th><th>出勤時刻</th><th>退勤時刻</th><th>勤務時間</th><th>超過時間</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>` : `<div class="empty-print">この月の勤務記録はありません。</div>`}`;
      printDocument("個人勤務履歴", `${person.name}｜勤務履歴`, content, month);
    }

    function attendanceCsvData() {
      const u = me();
      if (!u || u.role !== "admin") return null;
      const staff = DB.users.filter(person => person.companyId === u.companyId && person.role !== "family");
      const staffIds = new Set(staff.map(person => person.id));
      const rows = DB.attendance
        .filter(row => row.companyId === u.companyId && staffIds.has(row.userId) && monthKey(row.date) === state.exportMonth)
        .sort((a,b) => {
          const nameOrder = (userById(a.userId)?.name || "").localeCompare(userById(b.userId)?.name || "", "ja");
          return nameOrder || a.date.localeCompare(b.date);
        });
      const header = ["職員名","役割","日付","出勤時刻","退勤時刻","勤務時間","超過時間"];
      const lines = [header, ...rows.map(row => {
        const person = userById(row.userId);
        return [person?.name || "不明", person?.roleLabel || "", row.date, row.start || "", row.end || "", durationLabel(row), overtimeMinutesLabel(row)];
      })];
      return lines.map(line => line.map(csvCell).join(",")).join("\r\n");
    }
    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1200);
    }
    async function saveCsvFile(csv, filename) {
      const blob = new Blob(["\ufeff", csv], { type:"text/csv;charset=utf-8" });
      if ("showDirectoryPicker" in window) {
        try {
          const directory = await window.showDirectoryPicker({ mode:"readwrite" });
          const fileHandle = await directory.getFileHandle(filename, { create:true });
          const writable = await fileHandle.createWritable();
          await writable.write(blob);
          await writable.close();
          showSuccess("CSVを保存しました");
          return true;
        } catch (error) {
          if (error?.name === "AbortError") {
            showToast("保存をキャンセルしました");
            return false;
          }
        }
      }
      downloadBlob(blob, filename);
      showSuccess("CSVをダウンロードしました");
      return true;
    }
    async function saveAttendanceCsv() {
      const csv = attendanceCsvData();
      if (csv === null) return;
      const filename = safeFilename(`つなぐノート_${myCompany().name}_${state.exportMonth}_出退勤.csv`);
      await saveCsvFile(csv, filename);
    }
    function parseCsvRows(source) {
      const text = String(source || "").replace(/^\uFEFF/, "");
      const rows = [];
      let row = [];
      let cell = "";
      let quoted = false;
      for (let index = 0; index < text.length; index += 1) {
        const char = text[index];
        if (quoted) {
          if (char === '"' && text[index + 1] === '"') {
            cell += '"';
            index += 1;
          } else if (char === '"') {
            quoted = false;
          } else {
            cell += char;
          }
        } else if (char === '"') {
          quoted = true;
        } else if (char === ",") {
          row.push(cell);
          cell = "";
        } else if (char === "\n") {
          row.push(cell.replace(/\r$/, ""));
          rows.push(row);
          row = [];
          cell = "";
        } else {
          cell += char;
        }
      }
      if (cell.length || row.length) {
        row.push(cell.replace(/\r$/, ""));
        rows.push(row);
      }
      return rows.filter(values => values.some(value => value.trim()));
    }
    async function importAttendanceCsvFile(file) {
      const u = me();
      if (!u || u.role !== "admin" || !file) return;
      if (file.size > 2 * 1024 * 1024) {
        showToast("2MB以下のCSVファイルを選択してください");
        return;
      }
      try {
        const rows = parseCsvRows(await file.text());
        const header = rows.shift() || [];
        const nameIndex = header.indexOf("職員名");
        const dateIndex = header.indexOf("日付");
        const startIndex = header.indexOf("出勤時刻");
        const endIndex = header.indexOf("退勤時刻");
        if ([nameIndex,dateIndex,startIndex,endIndex].some(index => index < 0)) {
          showToast("つなぐノート形式のCSVではありません");
          return;
        }
        let imported = 0;
        let skipped = 0;
        rows.forEach((values, rowIndex) => {
          const name = String(values[nameIndex] || "").trim();
          const date = String(values[dateIndex] || "").trim();
          const start = String(values[startIndex] || "").trim();
          const end = String(values[endIndex] || "").trim();
          const person = DB.users.find(candidate => candidate.companyId === u.companyId && candidate.role !== "family" && candidate.name === name);
          const validDate = /^\d{4}-\d{2}-\d{2}$/.test(date);
          const validTime = value => value === "" || /^([01]\d|2[0-3]):[0-5]\d$/.test(value);
          if (!person || !validDate || !validTime(start) || !validTime(end) || (end && !start)) {
            skipped += 1;
            return;
          }
          let record = DB.attendance.find(item => item.userId === person.id && item.date === date);
          if (!record) {
            record = { id:`import-${Date.now()}-${rowIndex}`, companyId:u.companyId, userId:person.id, date, start:null, end:null };
            DB.attendance.push(record);
          }
          record.start = start || null;
          record.end = end || null;
          imported += 1;
        });
        renderApp();
        showToast(`${imported}件を取り込みました${skipped ? `（${skipped}件は確認が必要です）` : ""}`);
      } catch (error) {
        showToast("CSVを読み込めませんでした");
      }
    }

    /* =========================
       Feedback and startup
       ========================= */
    let toastTimer;
    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.innerHTML = `${icon("check","icon icon-sm")}<span>${escapeHTML(message)}</span>`;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2300);
    }
    let successTimer;
    function showSuccess(message) {
      const pop = document.getElementById("successPop");
      document.getElementById("successText").textContent = message;
      pop.classList.add("show");
      clearTimeout(successTimer);
      successTimer = setTimeout(() => pop.classList.remove("show"), 900);
    }

    window.addEventListener("hashchange", routeFromHash);
    document.addEventListener("keydown", event => {
      if (state.locked) {
        if (/^\d$/.test(event.key)) { event.preventDefault(); pressLockPin(event.key); }
        if (event.key === "Backspace") { event.preventDefault(); deleteLockPin(); }
        return;
      }
      if (event.key === "Escape" && document.getElementById("attendanceModal")?.classList.contains("open")) {
        closeAttendanceDetail();
        return;
      }
      if (state.loginStep !== "pin" || state.userId) return;
      if (/^\d$/.test(event.key)) { event.preventDefault(); pressPin(event.key); }
      if (event.key === "Backspace") { event.preventDefault(); deletePin(); }
    });
    ["pointerdown","keydown","scroll","touchstart"].forEach(eventName => {
      document.addEventListener(eventName, resetInactivityTimer, { passive:true, capture:true });
    });
    setInterval(updateClock, 1000);
    renderLogin();
  </script>
</body>
